apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-check
  namespace: demo
  labels:
    app: fraud-check
    part-of: log-triage-demo
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a bad config takes the service down instead
  # of leaving the old pod serving, so config faults have visible symptoms.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fraud-check
  template:
    metadata:
      labels:
        app: fraud-check
        part-of: log-triage-demo
    spec:
      containers:
        - name: app
          image: log-triage/fraud-check:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-check
  namespace: demo
  labels:
    app: fraud-check
spec:
  type: ClusterIP
  selector:
    app: fraud-check
  ports:
    - name: http
      port: 8080
      targetPort: http
