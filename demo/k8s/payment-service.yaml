apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: demo
  labels:
    app: payment-service
    part-of: log-triage-demo
spec:
  replicas: 1
  # Recreate, not RollingUpdate: a bad config takes the service down instead
  # of leaving the old pod serving, so config faults have visible symptoms.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        part-of: log-triage-demo
    spec:
      containers:
        - name: app
          image: log-triage/payment-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PAYMENT_PROVIDER_URL
              value: https://psp.example.test/v2
            - name: PAYMENT_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-provider
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: demo
  labels:
    app: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: http
